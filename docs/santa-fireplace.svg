<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title">
  <title id="title">Tomten vinkar bredvid en sprakande brasa</title>
  <defs>
    <clipPath id="frame"><rect width="480" height="340" rx="20"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M14 7l3 7-3 7-3-7z" fill="#faf4e8" opacity=".05"/>
    </pattern>
    <style>
      .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite; }
      .f2 { animation-duration: 1.2s; animation-delay: -.4s; }
      .f3 { animation-duration: 1.9s; animation-delay: -.8s; }
      .glow { animation: pulse 3.2s ease-in-out infinite; }
      .wave { transform-box: fill-box; transform-origin: 18% 88%; animation: wave 2.6s ease-in-out infinite; }
      .bulb { animation: twinkle 2.4s ease-in-out infinite; }
      .b2 { animation-delay: -.8s; }
      .b3 { animation-delay: -1.6s; }
      @keyframes flicker { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(.94, 1.08); } 60% { transform: scale(1.04, .95); } }
      @keyframes pulse { 0%, 100% { opacity: .8; } 50% { opacity: 1; } }
      @keyframes wave { 0%, 55%, 100% { transform: rotate(0); } 18% { transform: rotate(-12deg); } 36% { transform: rotate(6deg); } }
      @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Wall -->
    <rect width="480" height="340" fill="#24493a"/>
    <rect width="480" height="340" fill="url(#paper)"/>
    <ellipse class="glow" cx="355" cy="240" rx="200" ry="160" fill="url(#glow)"/>

    <!-- String lights -->
    <path d="M0 18Q120 48 240 22Q360 48 480 18" fill="none" stroke="#12291f" stroke-width="2"/>
    <g>
      <ellipse class="bulb" cx="24" cy="28" rx="3.2" ry="4.6" fill="#e04a3f"/>
      <ellipse class="bulb b2" cx="72" cy="36" rx="3.2" ry="4.6" fill="#ffd166"/>
      <ellipse class="bulb b3" cx="120" cy="39" rx="3.2" ry="4.6" fill="#faf4e8"/>
      <ellipse class="bulb" cx="168" cy="37" rx="3.2" ry="4.6" fill="#e04a3f"/>
      <ellipse class="bulb b2" cx="216" cy="31" rx="3.2" ry="4.6" fill="#ffd166"/>
      <ellipse class="bulb b3" cx="264" cy="31" rx="3.2" ry="4.6" fill="#faf4e8"/>
      <ellipse class="bulb" cx="312" cy="37" rx="3.2" ry="4.6" fill="#e04a3f"/>
      <ellipse class="bulb b3" cx="408" cy="36" rx="3.2" ry="4.6" fill="#faf4e8"/>
      <ellipse class="bulb" cx="456" cy="28" rx="3.2" ry="4.6" fill="#e04a3f"/>
    </g>

    <!-- Window with a snowy night -->
    <rect x="32" y="44" width="108" height="122" rx="6" fill="#efe4cf"/>
    <rect x="40" y="52" width="92" height="106" rx="3" fill="#10263a"/>
    <circle cx="112" cy="74" r="9" fill="#faf4e8"/>
    <circle cx="116.5" cy="70.5" r="8" fill="#10263a"/>
    <g fill="#faf4e8">
      <circle cx="50" cy="64" r="1.6"/>
      <circle cx="66" cy="80" r="1.3"/>
      <circle cx="58" cy="97" r="1.8"/>
      <circle cx="77" cy="68" r="1.4"/>
      <circle cx="98" cy="92" r="1.6"/>
      <circle cx="122" cy="98" r="1.3"/>
      <circle cx="104" cy="118" r="1.7"/>
      <circle cx="126" cy="128" r="1.4"/>
      <circle cx="73" cy="114" r="1.5"/>
      <circle cx="47" cy="122" r="1.3"/>
      <circle cx="95" cy="62" r="1.2"/>
    </g>
    <path d="M64 124L80 156H48Z" fill="#1a3a2c"/>
    <path d="M64 124L70.5 137Q64 134 57.5 137Z" fill="#faf4e8"/>
    <path d="M114 134L125 156H103Z" fill="#1a3a2c"/>
    <path d="M114 134L118.5 143Q114 141 109.5 143Z" fill="#faf4e8"/>
    <path d="M40 152Q60 144 86 150Q108 143 132 149V158H40Z" fill="#faf4e8"/>
    <rect x="84" y="52" width="4" height="106" fill="#efe4cf"/>
    <rect x="40" y="103" width="92" height="4" fill="#efe4cf"/>
    <rect x="26" y="164" width="120" height="9" rx="3" fill="#d6c3a0"/>

    <!-- Wreath -->
    <path d="M355 36V76" stroke="#b3302b" stroke-width="3"/>
    <circle cx="355" cy="100" r="22" fill="none" stroke="#2f6b4a" stroke-width="12"/>
    <circle cx="355" cy="100" r="22" fill="none" stroke="#3f8a5f" stroke-width="12" stroke-dasharray="3 6"/>
    <g fill="#d93a32">
      <circle cx="336" cy="90" r="2.8"/>
      <circle cx="372" cy="86" r="2.8"/>
      <circle cx="376" cy="108" r="2.8"/>
      <circle cx="342" cy="114" r="2.8"/>
      <circle cx="356" cy="78" r="2.8"/>
    </g>
    <path d="M355 122l-11-7v14zM355 122l11-7v14z" fill="#b3302b"/>
    <path d="M353 123l-6 13h5l3-9zM357 123l6 13h-5l-3-9z" fill="#8f231f"/>
    <circle cx="355" cy="122" r="3.5" fill="#8f231f"/>

    <!-- Floor -->
    <rect y="284" width="480" height="8" fill="#1b3a2d"/>
    <rect y="292" width="480" height="48" fill="#6e4a32"/>
    <path d="M0 307H480M0 323H480M60 292V307M180 307V323M300 292V307M420 307V323M120 323V340M260 323V340M390 323V340" stroke="#5c3d29" stroke-width="2"/>
    <ellipse class="glow" cx="355" cy="300" rx="130" ry="26" fill="url(#glow)"/>

    <!-- Rug -->
    <ellipse cx="180" cy="318" rx="140" ry="15" fill="#b3302b"/>
    <ellipse cx="180" cy="318" rx="124" ry="10" fill="none" stroke="#faf4e8" stroke-width="2" stroke-dasharray="6 5" opacity=".8"/>

