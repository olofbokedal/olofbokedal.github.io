    <path class="flame" d="M355 274C333 262 336 236 350 214C352 230 360 232 362 220C376 238 380 262 355 274Z" fill="#f28c28"/>
    <path class="flame f3" d="M338 274C326 266 328 250 336 240C338 250 344 252 346 246C352 258 350 270 338 274Z" fill="#e0582a"/>
    <path class="flame f2" d="M374 274C364 268 365 254 371 246C374 254 379 255 380 250C386 260 385 270 374 274Z" fill="#f28c28"/>
