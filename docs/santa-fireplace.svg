    <path d="M304 286V226Q304 192 355 192Q406 192 406 226V286Z" fill="#2a1913"/>
    <path d="M304 286V226Q304 192 355 192Q406 192 406 226V286" fill="none" stroke="#d6c3a0" stroke-width="5"/>

