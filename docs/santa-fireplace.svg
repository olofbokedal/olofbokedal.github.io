    <path d="M414 172H432V196Q432 202 438 204L444 206Q450 209 447 215Q444 220 436 218L422 214Q414 211 414 203Z" fill="#2f6b4a"/>
    <rect x="414" y="184" width="18" height="4" fill="#faf4e8" opacity=".9"/>

    <!-- Garland -->
    <path d="M262 152Q308 176 355 152Q402 176 448 152" fill="none" stroke="#2f6b4a" stroke-width="10" stroke-linecap="round"/>
    <path d="M262 152Q308 176 355 152Q402 176 448 152" fill="none" stroke="#3f8a5f" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 7"/>
    <g fill="#d93a32">
      <circle cx="285" cy="161" r="3"/>
      <circle cx="308" cy="164" r="3"/>
      <circle cx="331" cy="161" r="3"/>
      <circle cx="379" cy="161" r="3"/>
      <circle cx="402" cy="164" r="3"/>
      <circle cx="425" cy="161" r="3"/>
    </g>
    <g fill="#b3302b">
      <path d="M262 152l-8-6v12zM262 152l8-6v12z"/>
      <path d="M355 152l-8-6v12zM355 152l8-6v12z"/>
      <path d="M448 152l-8-6v12zM448 152l8-6v12z"/>
    </g>

    <!-- Gifts -->
    <rect x="228" y="262" width="30" height="28" rx="2" fill="#c9973a"/>
    <rect x="240" y="262" width="6" height="28" fill="#b3302b"/>
    <rect x="228" y="273" width="30" height="6" fill="#b3302b"/>
    <ellipse cx="238" cy="258" rx="5" ry="3.5" fill="none" stroke="#b3302b" stroke-width="3"/>
    <ellipse cx="248" cy="258" rx="5" ry="3.5" fill="none" stroke="#b3302b" stroke-width="3"/>
    <rect x="250" y="272" width="22" height="18" rx="2" fill="#b3302b"/>
    <rect x="259" y="272" width="4" height="18" fill="#faf4e8"/>
    <rect x="250" y="279" width="22" height="4" fill="#faf4e8"/>

    <!-- Santa -->
    <ellipse cx="166" cy="311" rx="56" ry="6" fill="#000" opacity=".22"/>
    <g transform="translate(0 12)">
      <!-- Sack -->
      <path d="M70 298C60 272 70 250 92 244H106C126 250 134 272 126 298Z" fill="#b08a5a"/>
      <path d="M86 244L90 228L97 240L102 226L108 240L112 230L114 244Z" fill="#b08a5a"/>
      <path d="M84 262Q96 272 92 290" fill="none" stroke="#9a764a" stroke-width="2" stroke-linecap="round"/>
      <rect x="86" y="240" width="28" height="7" rx="3.5" fill="#7d5f3c"/>

      <!-- Boots and trousers -->
      <rect x="132" y="282" width="31" height="16" rx="7" fill="#231c1a"/>
      <rect x="169" y="282" width="31" height="16" rx="7" fill="#231c1a"/>
      <rect x="144" y="260" width="45" height="26" fill="#9c2622"/>
      <rect x="164.5" y="266" width="4" height="20" fill="#7a1b18"/>

      <!-- Coat -->
      <path d="M124 262C119 222 128 184 166 178C204 184 213 222 208 262Z" fill="#c3342f"/>
      <rect x="160" y="190" width="12" height="68" fill="#faf4e8"/>
      <rect x="123" y="228" width="86" height="12" fill="#231c1a"/>
      <rect x="156" y="225.5" width="20" height="17" rx="2.5" fill="none" stroke="#d9a441" stroke-width="3"/>
      <rect x="119" y="254" width="94" height="14" rx="7" fill="#faf4e8"/>

      <!-- Arm holding the sack -->
      <path d="M136 194Q118 214 120 238" fill="none" stroke="#c3342f" stroke-width="18" stroke-linecap="round"/>
      <circle cx="120" cy="250" r="9" fill="#2f6b4a"/>
      <rect x="109" y="234" width="22" height="9" rx="4.5" fill="#faf4e8"/>

      <!-- Waving arm -->
      <g class="wave">
        <path d="M196 194Q222 184 226 158" fill="none" stroke="#c3342f" stroke-width="18" stroke-linecap="round"/>
        <circle cx="227" cy="145" r="9.5" fill="#2f6b4a"/>
        <ellipse cx="217.5" cy="148" rx="4" ry="5" fill="#2f6b4a"/>
        <rect x="215" y="152" width="22" height="9" rx="4.5" fill="#faf4e8" transform="rotate(-8 226 156)"/>
      </g>

      <!-- Head -->
      <circle cx="145" cy="150" r="5" fill="#eab896"/>
      <circle cx="187" cy="150" r="5" fill="#eab896"/>
      <circle cx="166" cy="148" r="21" fill="#f3c9a8"/>
      <path d="M142 146C139 178 151 202 166 208C181 202 193 178 190 146C184 160 176 166 166 166C156 166 148 160 142 146Z" fill="#fffaf0"/>
      <path d="M152 182q4 4 8 0M170 186q4 4 8 0M160 196q4 4 8 0" fill="none" stroke="#e9dcc3" stroke-width="2" stroke-linecap="round"/>
      <path d="M166 158C160 152 150 154 146 160C152 164 160 164 166 160C172 164 180 164 186 160C182 154 172 152 166 158Z" fill="#fffaf0" stroke="#eadfc9"/>
      <circle cx="166" cy="154" r="5" fill="#e3907f"/>
      <circle cx="151" cy="152" r="4.5" fill="#e88a80" opacity=".45"/>
      <circle cx="181" cy="152" r="4.5" fill="#e88a80" opacity=".45"/>
      <path d="M154 145q4-4.5 8 0M170 145q4-4.5 8 0" fill="none" stroke="#2b211d" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M152 138.5q5-3.5 10-1M170 137.5q5-2.5 10 1" fill="none" stroke="#fffaf0" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Hat -->
      <path d="M145 126C145 104 160 92 178 94C197 96 209 111 213 130C205 120 197 116 190 118C190 121 189 124 188 126Z" fill="#c3342f"/>
      <rect x="141" y="121" width="50" height="13" rx="6.5" fill="#faf4e8"/>
      <circle cx="214" cy="134" r="8" fill="#faf4e8"/>
