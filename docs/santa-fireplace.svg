      <rect x="366" y="170" width="22" height="8" rx="3"/>
      <rect x="392" y="165" width="18" height="9" rx="3"/>
      <rect x="276" y="200" width="20" height="10" rx="3"/>
      <rect x="279" y="230" width="16" height="10" rx="3"/>
      <rect x="276" y="258" width="20" height="10" rx="3"/>
      <rect x="414" y="204" width="18" height="10" rx="3"/>
      <rect x="412" y="236" width="20" height="9" rx="3"/>
      <rect x="415" y="262" width="17" height="10" rx="3"/>
