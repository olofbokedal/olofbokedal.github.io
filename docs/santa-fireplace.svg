    <rect x="261" y="143" width="15" height="4" rx="2" fill="#c9973a"/>
    <rect x="264" y="124" width="9" height="20" rx="2" fill="#faf4e8"/>
    <ellipse class="flame f3" cx="268.5" cy="118" rx="3" ry="5" fill="#ffd166"/>
    <rect x="434" y="143" width="15" height="4" rx="2" fill="#c9973a"/>
    <rect x="437" y="124" width="9" height="20" rx="2" fill="#faf4e8"/>
    <ellipse class="flame" cx="441.5" cy="118" rx="3" ry="5" fill="#ffd166"/>

